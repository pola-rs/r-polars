name: Lint Rust

on:
  pull_request:
    paths:
      - src/rust/**
      - crates/r-polars-plugin/**
      - .github/workflows/lint-rust.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - crates/r-polars-plugin/**
      - .github/workflows/lint-rust.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: -C debuginfo=0

jobs:
  cargo-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run cargo fmt
        working-directory: src/rust
        run: |
          rustup component add rustfmt
          cargo fmt --all --check
          cargo fmt --manifest-path ../../crates/r-polars-plugin/Cargo.toml --all --check

  cargo-clippy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: rui314/setup-mold@v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rust -> target"

      - name: Fix cache
        run: |
          # make sure savvy is built from source because rust-cache doesn't work well.
          (find ~/.cargo/registry/ src/rust/target -name 'savvy-*' -print0 | xargs -0 rm -rf) || true

      - name: Run cargo clippy
        working-directory: src/rust
        run: |
          rustup component add clippy
          cargo clippy \
            --all-targets \
            --all-features \
            --locked \
            -- \
            -D warnings \
            -D clippy::dbg_macro

      - name: Check plugin fixture
        working-directory: src/rust
        run: |
          manifest=../../crates/r-polars-plugin/Cargo.toml
          cargo build --manifest-path "$manifest" --target-dir target --release -p plugin-fixture
          library=target/release/libplugin_fixture.so
          symbols=$(nm -D --defined-only "$library")
          for symbol in get_version get_last_error_message add_offset field_add_offset; do
            grep -q " T _polars_plugin_${symbol}$" <<< "$symbols"
          done
          linkage=$(ldd "$library")
          echo "$linkage"
          if grep -Ei 'python|not found' <<< "$linkage"; then exit 1; fi
          cargo tree --manifest-path "$manifest" --prefix none > "$RUNNER_TEMP/plugin-dependencies.txt"
          if grep -E '^(pyo3|pyo3-ffi|polars-python) v' "$RUNNER_TEMP/plugin-dependencies.txt"; then exit 1; fi
